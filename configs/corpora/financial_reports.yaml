corpus_name: financial_reports
raw_data_dir: data/raw/financial_reports
processed_data_dir: data/processed/financial_reports

file_types:
  - pdf

ingestion:
  recursive: true
  encoding: utf-8

parser:
  type: financial_pdf_structured

chunking:
  strategy: section_then_tokens
  max_tokens: 500
  overlap_tokens: 100
  min_chunk_chars: 150

embedding:
  model_name: BAAI/bge-small-en-v1.5
  batch_size: 32
  normalize_embeddings: true

vectorstore:
  provider: qdrant
  collection_name: financial_reports_chunks
  host: localhost
  port: 6333
  distance: cosine
  recreate_collection: true
  batch_size: 64

retrieval:
  top_k: 20
  score_threshold: null

reranking:
  provider: cross_encoder
  model_name: BAAI/bge-reranker-base
  final_top_k: 5
  batch_size: 16

rag:
  answer_generator: extractive
  max_context_chunks: 5
  max_context_chars_per_chunk: 1200

evaluation:
  testset_path: data/evaluation/financial_reports/eval_v1_fixed.json
  output_stage_name: evaluation