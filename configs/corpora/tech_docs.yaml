corpus_name: tech_docs
raw_data_dir: data/raw/tech_docs
processed_data_dir: data/processed/tech_docs

file_types:
  - md
  - txt

ingestion:
  recursive: true
  encoding: utf-8

parser:
  type: markdown_structured

chunking:
  strategy: section_then_tokens
  max_tokens: 350
  overlap_tokens: 50
  min_chunk_chars: 150

embedding:
  model_name: BAAI/bge-small-en-v1.5
  batch_size: 32
  normalize_embeddings: true

vectorstore:
  provider: qdrant
  collection_name: tech_docs_chunks
  host: localhost
  port: 6333
  distance: cosine
  recreate_collection: true
  batch_size: 64

retrieval:
  top_k: 20
  score_threshold: null

reranking:
  provider: cross_encoder
  model_name: BAAI/bge-reranker-base
  final_top_k: 5
  batch_size: 16

rag:
  answer_generator: extractive
  max_context_chunks: 5
  max_context_chars_per_chunk: 1200

evaluation:
  testset_path: data/evaluation/tech_docs/eval_queries.json
  output_stage_name: evaluation